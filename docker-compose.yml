services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      # Контекст — корень репо, чтобы multi-stage Dockerfile видел
      # и backend/, и frontend/ исходники.
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://messenger:messenger@db:5432/messenger
      SYNC_DATABASE_URL: postgresql+psycopg2://messenger:messenger@db:5432/messenger
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DEBUG: "false"
    ports:
      - "8000:8000"

volumes:
  pgdata:
